<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pañol Digital — Servicio Pesado</title>
<style>
  :root{
    --steel-950:#15181b;
    --steel-900:#1c2024;
    --steel-800:#262b30;
    --steel-700:#333a41;
    --steel-600:#454e56;
    --steel-500:#5c6770;
    --line:#3a4147;
    --paper:#eceae4;
    --paper-dim:#b9b6ac;
    --yellow:#f2b705;
    --yellow-dim:#8a6b12;
    --red:#d1483f;
    --red-dim:#5c2b27;
    --green:#5c9a6a;
    --green-dim:#2c4630;
    --amber:#d98e3c;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --cond: 'Arial Narrow', 'Helvetica Neue Condensed', Impact, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--steel-950);color:var(--paper);font-family:var(--body);}

  /* hazard stripe pattern */
  .hazard{
    background: repeating-linear-gradient(135deg, var(--yellow) 0 14px, var(--steel-950) 14px 28px);
  }

  header.top{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,var(--steel-900),var(--steel-950));
    border-bottom:3px solid var(--steel-700);
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .hazard-bar{height:6px;}
  .top-inner{
    max-width:1180px;margin:0 auto;padding:18px 20px 14px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{
    width:46px;height:46px;border-radius:6px;
    background:var(--yellow); color:var(--steel-950);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--cond); font-weight:900; font-size:22px; letter-spacing:-1px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.4);
    transform: rotate(-2deg);
  }
  h1{
    font-family:var(--cond); font-weight:800; text-transform:uppercase;
    font-size:26px; letter-spacing:1px; margin:0; line-height:1;
  }
  .brand small{
    display:block; margin-top:4px; font-family:var(--mono); font-size:11px;
    letter-spacing:2px; color:var(--paper-dim); text-transform:uppercase;
  }
  .stats-strip{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{
    background:var(--steel-800); border:1px solid var(--line); border-radius:4px;
    padding:8px 12px; min-width:86px; text-align:center;
  }
  .stat b{display:block; font-family:var(--cond); font-size:20px; font-weight:800;}
  .stat span{font-family:var(--mono); font-size:9px; letter-spacing:1px; color:var(--paper-dim); text-transform:uppercase;}
  .stat.ok b{color:var(--green);}
  .stat.bad b{color:var(--red);}
  .stat.miss b{color:var(--amber);}

  .controls{
    max-width:1180px;margin:0 auto;padding:14px 20px 16px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .search-wrap{position:relative; flex:1 1 320px; min-width:260px;}
  .search-wrap input{
    width:100%; background:var(--steel-800); border:1px solid var(--line); color:var(--paper);
    padding:12px 14px 12px 40px; border-radius:4px; font-size:15px; font-family:var(--body);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--yellow);}
  .search-wrap input::placeholder{color:var(--steel-500); font-family:var(--mono); font-size:13px;}
  .search-icon{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--steel-500); pointer-events:none;}

  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{
    font-family:var(--cond); font-weight:800; font-size:15px;
    background:var(--steel-800); border:1px solid var(--line); color:var(--paper-dim);
    padding:8px 13px; border-radius:3px; cursor:pointer; letter-spacing:.5px;
  }
  .tab.active{background:var(--yellow); color:var(--steel-950); border-color:var(--yellow);}
  .tab b{font-family:var(--mono); font-weight:400; font-size:10px; margin-left:5px; opacity:.75;}

  .status-filter{display:flex; gap:6px;}
  .sf-btn{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--steel-800);
  }
  .sf-btn.active{border-color:var(--paper);}
  .sf-dot{width:12px;height:12px;border-radius:50%;}

  main{max-width:1180px;margin:0 auto;padding:6px 20px 60px;}

  .estante-heading{
    font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:1px;
    font-size:15px; color:var(--paper-dim); margin:26px 0 12px; display:flex; align-items:center; gap:10px;
  }
  .estante-heading .line{flex:1; height:1px; background:var(--line);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}

  .card{
    background:var(--steel-900); border:1px solid var(--line); border-radius:6px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card-photo{
    width:100%; aspect-ratio:16/10; background:var(--steel-800);
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  .card-photo img{width:100%; height:100%; object-fit:cover; cursor:zoom-in;}
  .card-photo .noimg{font-family:var(--mono); font-size:10px; color:var(--steel-600); letter-spacing:1px; text-transform:uppercase;}
  .cas-tag{
    position:absolute; top:8px; left:8px;
    background:var(--steel-950); border:1px solid var(--yellow); color:var(--yellow);
    font-family:var(--cond); font-weight:800; font-size:13px; padding:3px 9px; border-radius:3px;
    letter-spacing:.5px;
  }
  .card-body{padding:10px 12px 12px;}
  .item-row{
    display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-top:1px solid var(--steel-800);
    cursor:pointer;
  }
  .item-row:first-child{border-top:none;}
  .item-row:hover{background:var(--steel-800);}
  .dot{
    margin-top:5px; width:9px;height:9px;border-radius:50%; flex:none;
    background:var(--green); box-shadow:0 0 0 2px var(--green-dim);
  }
  .dot.bad{background:var(--red); box-shadow:0 0 0 2px var(--red-dim);}
  .dot.miss{background:var(--amber); box-shadow:0 0 0 2px #5c4322;}
  .item-txt{flex:1; min-width:0;}
  .item-txt .name{font-size:13.5px; line-height:1.3;}
  .item-txt .meta{font-family:var(--mono); font-size:10.5px; color:var(--paper-dim); margin-top:1px;}

  .empty-state{
    text-align:center; padding:70px 20px; color:var(--steel-500);
  }
  .empty-state h2{font-family:var(--cond); font-size:22px; text-transform:uppercase; color:var(--paper-dim);}

  /* modal / tag detail */
  .overlay{
    position:fixed; inset:0; background:rgba(10,11,12,.78); z-index:100;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .overlay.show{display:flex;}
  .tag{
    background:var(--paper); color:var(--steel-950); width:min(420px,92vw);
    border-radius:6px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.6);
    font-family:var(--body);
  }
  .tag::before{
    content:""; position:absolute; top:14px; left:14px; width:16px;height:16px;
    background:var(--steel-950); border-radius:50%; box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
  }
  .tag-photo{width:100%; aspect-ratio:16/10; background:var(--steel-800); overflow:hidden; border-radius:6px 6px 0 0;}
  .tag-photo img{width:100%;height:100%;object-fit:cover;}
  .tag-inner{padding:18px 20px 20px 40px;}
  .tag-cas{font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--steel-600); text-transform:uppercase;}
  .tag h3{font-family:var(--cond); font-weight:800; font-size:22px; margin:4px 0 10px; text-transform:uppercase; line-height:1.15;}
  .tag-field{display:flex; justify-content:space-between; padding:6px 0; border-top:1px dashed #c9c6ba; font-size:13px;}
  .tag-field span:first-child{color:var(--steel-600); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px;}
  .tag-field span:last-child{font-weight:600; text-align:right; max-width:60%;}
  .tag-status{display:flex; gap:8px; margin-top:14px;}
  .tag-status button{
    flex:1; border:none; border-radius:4px; padding:10px 6px; font-family:var(--cond);
    font-weight:800; text-transform:uppercase; font-size:12px; letter-spacing:.5px; cursor:pointer;
    color:#fff; opacity:.5;
  }
  .tag-status button.on{opacity:1; box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .st-ok{background:var(--green);}
  .st-bad{background:var(--red);}
  .st-miss{background:var(--amber);}
  .close-x{
    position:absolute; top:10px; right:10px; width:28px;height:28px;border-radius:50%;
    background:var(--steel-950); color:var(--paper); border:none; cursor:pointer; font-size:15px;
  }

  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; display:none;
    align-items:center; justify-content:center; padding:20px; cursor:zoom-out;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:6px;}

  footer{
    max-width:1180px;margin:0 auto;padding:20px 20px 40px; display:flex; justify-content:space-between;
    align-items:center; flex-wrap:wrap; gap:10px; border-top:1px solid var(--line); margin-top:20px;
  }
  .export-btn{
    background:var(--steel-800); border:1px solid var(--line); color:var(--paper);
    font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    padding:10px 16px; border-radius:4px; cursor:pointer; font-size:13px;
  }
  .export-btn:hover{border-color:var(--yellow); color:var(--yellow);}
  footer p{font-family:var(--mono); font-size:10.5px; color:var(--steel-600); margin:0;}

  @media (max-width:600px){
    h1{font-size:20px;}
    .stats-strip{width:100%; justify-content:space-between;}
    .stat{flex:1; min-width:0;}
  }
</style>
</head>

<header class="top">
  <div class="hazard-bar hazard"></div>
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <h1>Pañol Digital</h1>

  <div class="controls">

    </div>
  </div>
  <div class="controls" style="padding-top:0;">
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main id="main"></main>

<footer>
  <button class="export-btn" id="exportBtn">⬇ Exportar reporte de auditoría (CSV)</button>
  <p>235 herramientas · 12 estantes · Datos base: inventario original del pañol</p>
</footer>

<div class="overlay" id="overlay">
  <div class="tag" id="tagContent"></div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="">
</div>

<script>
const ITEMS = JSON.parse(document.getElementById('items-data').textContent);
const PHOTOS = JSON.parse(document.getElementById('photos-data').textContent);

const ESTANTE_ORDER = ['A','B','C','D','E','F','G','H','I','J','M'];

// ---- storage wrapper (works inside claude.ai artifacts, falls back to memory) ----
const memStore = {};
async function storeGet(key){
  try{
    if (window.storage){
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }
  }catch(e){ /* key not found or storage unavailable */ }
  return memStore[key] ?? null;
}
async function storeSet(key, value){
  try{
    if (window.storage){
      await window.storage.set(key, value, false);
      return;
    }
  }catch(e){}
  memStore[key] = value;
}

let STATE = {}; // id -> 'ok'|'bad'|'miss'

async function loadState(){
  const raw = await storeGet('panol_estado_v1');
  if (raw){
    try{ STATE = JSON.parse(raw); }catch(e){ STATE = {}; }
  }
}
async function saveState(){
  await storeSet('panol_estado_v1', JSON.stringify(STATE));
}
function getStatus(id){ return STATE[id] || 'ok'; }

// ---- grouping ----
function groupByCasillero(items){
  const map = new Map();
  items.forEach(it=>{
    if(!map.has(it.ubicacion)) map.set(it.ubicacion, []);
    map.get(it.ubicacion).push(it);
  });
  return map;
}

let activeTab = 'TODOS';
let activeStatusFilter = 'all';
let searchQuery = '';

function computeStats(){
  let ok=0,bad=0,miss=0;
  ITEMS.forEach(it=>{
    const s = getStatus(it.id);
    if(s==='bad') bad++; else if(s==='miss') miss++; else ok++;
  });
  return {ok,bad,miss,total:ITEMS.length};
}

function renderStats(){
  const s = computeStats();
  document.getElementById('statsStrip').innerHTML = `
    <div class="stat"><b>${s.total}</b><span>Total</span></div>
    <div class="stat ok"><b>${s.ok}</b><span>Disponible</span></div>
    <div class="stat bad"><b>${s.bad}</b><span>Defectuosa</span></div>
    <div class="stat miss"><b>${s.miss}</b><span>No se encuentra</span></div>
  `;
}

function renderTabs(){
  const counts = {};
  ITEMS.forEach(it=>{ counts[it.estante] = (counts[it.estante]||0)+1; });
  const tabsEl = document.getElementById('tabs');
  let html = `<div class="tab ${activeTab==='TODOS'?'active':''}" data-tab="TODOS">TODOS <b>${ITEMS.length}</b></div>`;
  ESTANTE_ORDER.forEach(e=>{
    if(!counts[e]) return;
    html += `<div class="tab ${activeTab===e?'active':''}" data-tab="${e}">EST. ${e} <b>${counts[e]}</b></div>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      activeTab = t.dataset.tab;
      render();
    });
  });
}

function matchesSearch(it, q){
  if(!q) return true;
  const hay = (it.descripcion+' '+it.marca+' '+it.parte+' '+it.ubicacion+' '+it.obs).toLowerCase();
  return hay.includes(q);
}

function statusDotClass(s){
  if(s==='bad') return 'dot bad';
  if(s==='miss') return 'dot miss';
  return 'dot';
}

function firstPhoto(casillero){
  const arr = PHOTOS[casillero];
  if(arr && arr.length) return arr[0];
  return null;
}
function allPhotos(casillero){
  return PHOTOS[casillero] || [];
}

function render(){
  renderStats();
  renderTabs();
  const q = searchQuery.trim().toLowerCase();

  let pool = ITEMS.filter(it => matchesSearch(it, q));
  if(!q && activeTab !== 'TODOS'){
    pool = pool.filter(it => it.estante === activeTab);
  }
  if(activeStatusFilter !== 'all'){
    pool = pool.filter(it => getStatus(it.id) === activeStatusFilter);
  }

  const main = document.getElementById('main');

  if(pool.length === 0){
    main.innerHTML = `<div class="empty-state"><h2>Sin resultados</h2><p>Prueba con otro término o cambia el filtro de estado.</p></div>`;
    return;
  }

  // group by estante -> casillero, preserving order
  const byEstante = new Map();
  pool.forEach(it=>{
    if(!byEstante.has(it.estante)) byEstante.set(it.estante, []);
    byEstante.get(it.estante).push(it);
  });

  let html = '';
  const estKeys = q ? [...byEstante.keys()].sort() : (activeTab==='TODOS' ? ESTANTE_ORDER.filter(e=>byEstante.has(e)) : [activeTab]);

  estKeys.forEach(est=>{
    const estItems = byEstante.get(est);
    if(!estItems) return;
    html += `<div class="estante-heading">ESTANTE ${est}<div class="line"></div></div>`;
    html += `<div class="grid">`;
    const casMap = groupByCasillero(estItems);
    casMap.forEach((its, casillero)=>{
      const photo = firstPhoto(casillero);
      html += `<div class="card">
        <div class="card-photo" ${photo?`data-cas="${casillero}"`:''}>
          ${photo ? `<img src="data:image/jpeg;base64,${photo}" data-cas="${casillero}">` : `<span class="noimg">Sin foto de referencia</span>`}
          <div class="cas-tag">${casillero}</div>
        </div>
        <div class="card-body">
          ${its.map(it=>`
            <div class="item-row" data-id="${it.id}">
              <div class="${statusDotClass(getStatus(it.id))}"></div>
              <div class="item-txt">
                <div class="name">${escapeHtml(it.descripcion)}</div>
                <div class="meta">${escapeHtml(it.marca||'—')}${it.parte?' · '+escapeHtml(it.parte):''}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  main.innerHTML = html;

  // bind clicks
  main.querySelectorAll('.item-row').forEach(row=>{
    row.addEventListener('click', ()=> openTag(row.dataset.id));
  });
  main.querySelectorAll('.card-photo img').forEach(img=>{
    img.addEventListener('click', (e)=>{
      e.stopPropagation();
      openLightbox(img.src);
    });
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- tag modal ----
function openTag(id){
  const it = ITEMS.find(x=>x.id===id);
  if(!it) return;
  const photo = firstPhoto(it.ubicacion);
  const status = getStatus(id);
  const tag = document.getElementById('tagContent');
  tag.innerHTML = `
    <button class="close-x" id="closeTag">✕</button>
    ${photo ? `<div class="tag-photo"><img src="data:image/jpeg;base64,${photo}"></div>` : ''}
    <div class="tag-inner">
      <div class="tag-cas">Casillero ${it.ubicacion}</div>
      <h3>${escapeHtml(it.descripcion)}</h3>
      <div class="tag-field"><span>Marca</span><span>${escapeHtml(it.marca||'—')}</span></div>
      <div class="tag-field"><span>N° de parte</span><span>${escapeHtml(it.parte||'—')}</span></div>
      <div class="tag-field"><span>Observación</span><span>${escapeHtml(it.obs||'—')}</span></div>
      <div class="tag-status">
        <button class="st-ok ${status==='ok'?'on':''}" data-st="ok">Disponible</button>
        <button class="st-bad ${status==='bad'?'on':''}" data-st="bad">Defectuosa</button>
        <button class="st-miss ${status==='miss'?'on':''}" data-st="miss">No está</button>
      </div>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('closeTag').addEventListener('click', closeTag);
  tag.querySelectorAll('.tag-status button').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      STATE[id] = btn.dataset.st;
      await saveState();
      openTag(id); // refresh button states
      renderStats();
      // update dot in background grid without full re-render if present
      const row = document.querySelector(`.item-row[data-id="${id}"] .dot`);
      if(row){ row.className = statusDotClass(btn.dataset.st); }
    });
  });
}
function closeTag(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeTag();
});

// ---- lightbox ----
function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').classList.remove('show');
});

// ---- search & status filter bindings ----
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  render();
});
document.getElementById('statusFilter').addEventListener('click', (e)=>{
  const btn = e.target.closest('.sf-btn');
  if(!btn) return;
  activeStatusFilter = btn.dataset.st;
  document.querySelectorAll('.sf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

// ---- CSV export ----
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const rows = [['Estante','Ubicacion','Descripcion','Marca','N_Parte','Estado']];
  const label = {ok:'Disponible', bad:'Defectuosa', miss:'No se encuentra'};
  ITEMS.forEach(it=>{
    rows.push([it.estante, it.ubicacion, it.descripcion, it.marca, it.parte, label[getStatus(it.id)]]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `panol_auditoria_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

// ---- init ----
(async function init(){
  await loadState();
  render();
